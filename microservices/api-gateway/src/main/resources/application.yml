spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: http://localhost:8081
              predicates:
                - Path=/products/**

            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/users/**

            - id: cart-service
              uri: http://localhost:8083
              predicates:
                - Path=/cart/**

            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/orders/**

            - id: payment-service
              uri: http://localhost:8085
              predicates:
                - Path=/payments/**

server:
  port: 8090

spring.cloud.compatibility-verifier.enabled: false
