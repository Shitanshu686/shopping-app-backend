# Spring Boot Test Configuration
spring.main.banner-mode=off

# Exclude legacy gRPC Server Security auto-configuration
spring.autoconfigure.exclude=net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

# Primary DataSource (H2 MySQL-mode for Tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Secondary PostgreSQL DataSource (H2 PostgreSQL-mode for Tests)
spring.datasource.postgres.url=jdbc:h2:mem:auditdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.postgres.jdbc-url=jdbc:h2:mem:auditdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.postgres.driver-class-name=org.h2.Driver
spring.datasource.postgres.username=sa
spring.datasource.postgres.password=
spring.jpa.postgres.hibernate.ddl-auto=create-drop

# Kafka test configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
