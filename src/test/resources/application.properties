spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.kafka.bootstrap-servers=localhost:9999
spring.data.mongodb.uri=mongodb://localhost:27017/test
spring.autoconfigure.exclude=net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

# Isolated Audit datasource for Spring tests
spring.datasource.postgres.enabled=true
spring.datasource.postgres.jdbc-url=jdbc:h2:mem:auditdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.postgres.username=sa
spring.datasource.postgres.password=
spring.datasource.postgres.driver-class-name=org.h2.Driver
