spring.application.name=shopping-app-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3308/shopping_db
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

logging.level.com.shitanshu.shopping=DEBUG
logging.file.name=logs/shopping-app.log
spring.datasource.url=jdbc:mysql://localhost:3306/shopping_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
