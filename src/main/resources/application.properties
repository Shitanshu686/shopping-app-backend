spring.application.name=shopping-app-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3308/shopping_db
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

logging.level.com.shitanshu.shopping=DEBUG
logging.file.name=logs/shopping-app.log
spring.datasource.url=jdbc:mysql://localhost:3308/shopping_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql
spring.graphql.graphiql.path=/graphiql

# gRPC Server Configuration
grpc.server.port=9090
# Client mapping for internal test
grpc.client.product-service.address=static://localhost:9090,localhost:9091
grpc.client.product-service.default-load-balancing-policy=round_robin
grpc.client.product-service.negotiation-type=plaintext
spring.autoconfigure.exclude=net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

# ==========================================
# 30.18: DISTRIBUTED SYSTEMS & RESILIENCE
# ==========================================
# Circuit Breaker: 50% failure rate par circuit OPEN karega
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=2

# Retry: Maximum 3 attempts with 1s interval
resilience4j.retry.instances.paymentService.max-attempts=3
resilience4j.retry.instances.paymentService.wait-duration=1s

# Bulkhead: Max 2 concurrent execution threads allowed
resilience4j.bulkhead.instances.paymentService.max-concurrent-calls=2
resilience4j.bulkhead.instances.paymentService.max-wait-duration=100ms
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# =====================================================
# MODULE 34: REDIS & CACHING CONFIGURATION
# =====================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# =====================================================
# MODULE 34: HIKARICP CONNECTION POOL OPTIMIZATION
# =====================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=ShopEaseHikariCP

# =====================================================
# MODULE 35: APACHE KAFKA CONFIGURATION
# =====================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=shopease-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.shitanshu.shopping.*
